[project]
name = "foundry-ops"
version = "0.1.0"
description = "Foundry-side scaffold for the RORgamma hackathon grid: query generation and prediction collection."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "rdkit>=2026.3.6",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.4",
]

[tool.uv]
package = false
